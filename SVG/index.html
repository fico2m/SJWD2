<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        svg {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <svg width="600" height="700">

       <!--IZRADA PRAVOKUTNIKA-->
       <rect

       x="60"
       y="70"
       width="200"
       height="100"
       fill="pink"
       stroke="red"
       stroke-width="3"

       />

       <!--IZRADA KRUGA-->

       <circle
       cx="267"
       cy="300"
       r="67"
       fill="lightpink"
       
       />

       <!--IZRADA ELIPSE-->
       <ellipse
       cx="100"
       cy="267"
       rx="100"
       ry="50"
       fill="lightblue"

       />

       <!--IZRADA LINIJE-->
       <line
       x1="200"
       y1="250"
       x2="200"
       y2="600"
       stroke="purple"
       stroke-width="50"
       />
    </svg>
</body>
</html>
